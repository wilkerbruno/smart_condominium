[tool.poetry]
name = "smart-condominium"
version = "1.0.0"
description = "Sistema de gestão de condomínios"
authors = ["Projeto_condominio"]
readme = "README.md"

[tool.poetry.dependencies]
python      = "^3.12"
Flask       = "^3.0.3"
Flask-SQLAlchemy = "^3.1.1"
flask-migrate    = "^4.0.7"
pymysql     = "^1.1.1"
Werkzeug    = "^3.0.3"
unidecode   = "^1.3.8"
gunicorn    = "^22.0.0"

# Dependências de dev — não instaladas em produção (poetry install --no-dev)
[tool.poetry.group.dev.dependencies]
isort  = "^5.13.2"
black  = "24.4.2"
pytest = "^8.2.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"